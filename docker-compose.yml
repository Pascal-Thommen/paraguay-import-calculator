services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: paraguay-calc-db
    environment:
      POSTGRES_PASSWORD: root
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paraguay -d paraguay_calc"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paraguay-calc-app
    ports:
      - "8501:8501"
    environment:
      DB_HOST: paraguay-calc-db
      DB_PORT: 5432
      DB_NAME: paraguay_calc
      DB_USER: paraguay
      DB_PASSWORD: paraguay
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
